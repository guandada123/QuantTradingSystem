# ⚠️ 端口绑定纪律（2026-10-11 安全审计后收紧）：
#   基础设施/监控端口（PG 15432 / Redis 6379 / QuestDB 8812,9000 / RabbitMQ 5672,15672
#   / Alertmanager 9093 / Prometheus 9090 / Grafana 3001 / ES 9200 / Logstash 5044,9600
#   / Kibana 5601）一律绑定 **127.0.0.1**，不再对局域网暴露。
#   本机消费方（Claw 的 qts_client 走 127.0.0.1:15432 / :8000）不受影响；
#   远程访问请走 SSH 隧道或 Tailscale，不要改回 0.0.0.0。
#   应用端口（8000/8001/8002 与 dashboard 3000）保持原绑定不变。
services:
  # 策略研究服务
  strategy-service:
    profiles: ["microservices"]
    build:
      context: ./strategy-service
      dockerfile: Dockerfile
    container_name: quant-strategy
    ports:
      # 2026-10-11 收窄：应用服务原先绑 0.0.0.0（局域网可达）。
      #   已核实**无局域网消费方**（全仓无 192.168/10.x:80xx 引用）、
      #   容器间互调走服务名（http://strategy-service:8000）、无 host.docker.internal 回连，
      #   宿主侧消费方（Claw qts_client / health_check / unified_ops_center）均走 localhost ✓。
      #   execution-service 能下单，尤其不应暴露在局域网。
      - "127.0.0.1:8000:8000"
    environment:
      # 时区统一为北京时间（2026-09-29）：此前容器与 PG 都是 UTC，导致 DB 默认 now() 写出的时间戳早 8 小时、凌晨的日期会记成前一天
      - TZ=Asia/Shanghai
      - DATABASE_URL=postgresql+psycopg2://${DB_USER:-quant_user}:${DB_PASSWORD:-quant_pass}@postgres:5432/${DB_NAME:-quant_trading}
      - REDIS_URL=redis://redis:6379/0
      - QUESTDB_URL=http://questdb:8812
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-quant_user}:${RABBITMQ_PASSWORD:-quant_pass}@rabbitmq:5672
      - AKSHARE_TOKEN=${AKSHARE_TOKEN}
      - TUSHARE_TOKEN=${TUSHARE_TOKEN}
      - FEISHU_WEBHOOK=${FEISHU_WEBHOOK}
      # AI 密钥接线（2026-10-11 审计补）：此前 strategy-service **完全没注入 AI 密钥**
      #   （`core.config` 读到的 DEEPSEEK_API_KEY=None）→ AI复盘（jobs.ai_review）与
      #   其它 AI 路径一律「未配置API密钥」静默跳过 —— 能力从未接通过电。
      # ⚠️ 现状：根 .env 里的 DEEPSEEK_API_KEY 经 API 实测**已失效**
      #   （`/user/balance` 返回 Authentication Fails: invalid）→ 接线后仍不会产出，
      #   但**更新密钥即自动生效**，无需再改 compose。
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - AUTO_EXECUTE_SIGNALS=true
      - EXECUTION_API_KEY=${API_KEYS}
      - API_KEYS=${API_KEYS}  # 2026-08-13 打通: auth 读 API_KEYS, 供 Claw qts_client 走 X-API-Key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      questdb:
        condition: service_started
      rabbitmq:
        condition: service_started
    volumes:
      - ./strategy-service:/app
      - ./shared:/app/shared
      - ./data:/app/data
    networks:
      - quant-network
    restart: unless-stopped
    # 2026-10-13：512m → 768m。审计实测用量 305.5MiB/512MiB（59.7%），
    # 盘中调度作业并发时有 OOM kill 风险；768m 留 ~2.5x 余量。
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # 交易执行服务
  execution-service:
    profiles: ["microservices"]
    build:
      context: .
      dockerfile: execution-service/Dockerfile
    container_name: quant-execution
    cap_add:
      - NET_ADMIN
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      # 时区统一为北京时间（2026-09-29）：此前容器与 PG 都是 UTC，导致 DB 默认 now() 写出的时间戳早 8 小时、凌晨的日期会记成前一天
      - TZ=Asia/Shanghai
      - DATABASE_URL=postgresql+psycopg2://${DB_USER:-quant_user}:${DB_PASSWORD:-quant_pass}@postgres:5432/${DB_NAME:-quant_trading}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-quant_user}:${RABBITMQ_PASSWORD:-quant_pass}@rabbitmq:5672
      - MINIQMT_USER=${MINIQMT_USER}
      - MINIQMT_PASSWORD=${MINIQMT_PASSWORD}
      - QMT_BRIDGE_URL=${QMT_BRIDGE_URL}
      - FEISHU_WEBHOOK=${FEISHU_WEBHOOK}
      - ALLOW_OFF_HOURS_TRADING=true
      - API_KEYS=${API_KEYS}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - ./execution-service:/app/execution-service
      - ./shared:/app/shared
      - ./data:/app/data
    networks:
      - quant-network
    restart: unless-stopped
    mem_limit: 512m

  # AI调度器微服务
  ai-scheduler:
    profiles: ["microservices"]
    build:
      context: .
      dockerfile: ai-scheduler/Dockerfile
    container_name: quant-ai-scheduler
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      # 时区统一为北京时间（2026-09-29）：此前容器与 PG 都是 UTC，导致 DB 默认 now() 写出的时间戳早 8 小时、凌晨的日期会记成前一天
      - TZ=Asia/Shanghai
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - STRATEGY_SERVICE_URL=http://strategy-service:8000
      - EXECUTION_SERVICE_URL=http://execution-service:8001
      - FEISHU_WEBHOOK=${FEISHU_WEBHOOK}
    depends_on:
      strategy-service:
        condition: service_healthy
      execution-service:
        condition: service_healthy
    volumes:
      - ./ai-scheduler/main.py:/app/ai-scheduler/main.py
      - ./ai-scheduler/api:/app/ai-scheduler/api
      - ./ai-scheduler/core:/app/ai-scheduler/core
      - ./ai-scheduler/services:/app/ai-scheduler/services
      - ./shared:/app/shared
    networks:
      - quant-network
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Web前端（Nginx反向代理 + 静态文件）
  dashboard:
    profiles: ["web"]
    image: nginx:alpine
    container_name: quant-dashboard
    ports:
      # 2026-10-13 安全收紧：0.0.0.0 → 127.0.0.1（已核实无局域网消费者，
      #   全仓无 192.168/10.x:3000 引用）。远程访问改走云服务器反代 / Tailscale。
      #   回滚：将下行改回 "3000:80" 后 docker compose up -d quant-dashboard
      - "127.0.0.1:3000:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      # 2026-10-15：改为 envsubst 模板挂载，用于把 API 密钥注入反代头
      #   （密钥来自 .env 的 API_KEYS，经环境变量传入，**不落仓库文件**）
      - ./monitoring/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
    environment:
      # nginx 官方镜像入口脚本会处理 /etc/nginx/templates/*.template 并输出到该目录
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
      # 仪表盘 nginx 反代 QTS API 时需携带；QTS 后端 auth 校验 X-API-Key
      - QTS_API_KEY=${API_KEYS}
    depends_on:
      strategy-service:
        condition: service_healthy
    networks:
      - quant-network
    restart: unless-stopped

  # PostgreSQL + TimescaleDB数据库（备选端口 15432，本地 PG 占 5432）
  postgres:
    profiles: ["infra"]
    image: timescale/timescaledb:latest-pg15
    container_name: quant-postgres
    environment:
      # 时区统一为北京时间（2026-09-29）：此前容器与 PG 都是 UTC，导致 DB 默认 now() 写出的时间戳早 8 小时、凌晨的日期会记成前一天
      - TZ=Asia/Shanghai
      - POSTGRES_USER=${DB_USER:-quant_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-quant_pass}
      - POSTGRES_DB=${DB_NAME:-quant_trading}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quant-network
    restart: unless-stopped

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: quant-redis
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - quant-network
    restart: unless-stopped

  # QuestDB时序数据库
  questdb:
    profiles: ["infra"]
    image: questdb/questdb:latest
    container_name: quant-questdb
    ports:
      - "127.0.0.1:8812:8812"
      - "127.0.0.1:9000:9000"
    environment:
      # TTL 策略 — QuestDB TTL 按表设置（CREATE/ALTER TABLE ... TTL N DAYS）
      # 推荐：行情数据 7 天，交易数据 30 天，指标数据 90 天
      # 示例：ALTER TABLE market_ticks SET TTL 7 DAYS;
      QDB_TTL_MARKER_TTL_SECONDS: 86400  # 标记数据默认 24h
    volumes:
      - questdb_data:/root/.questdb
    networks:
      - quant-network
    restart: unless-stopped

  # RabbitMQ消息队列
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: quant-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-quant_user}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-quant_pass}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - quant-network
    restart: unless-stopped

  # Alertmanager→飞书适配器
  alertmanager-feishu:
    profiles: ["monitoring"]
    build:
      context: ./monitoring
      dockerfile: Dockerfile.alertmanager-feishu
    container_name: quant-alertmanager-feishu
    ports:
      - "127.0.0.1:9093:9093"
    environment:
      - FEISHU_ALERT_WEBHOOK=${FEISHU_WEBHOOK}
    networks:
      - quant-network
    restart: unless-stopped

  # Prometheus监控
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    container_name: quant-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - ./monitoring/slo_alerts.yml:/etc/prometheus/slo_alerts.yml
      - ./monitoring/sli_recording_rules.yml:/etc/prometheus/sli_recording_rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - quant-network
    restart: unless-stopped

  # Grafana可视化
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:latest
    container_name: quant-grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources_alt
    networks:
      - quant-network
    restart: unless-stopped

  # ELK Stack - Elasticsearch
  elasticsearch:
    profiles: ["monitoring"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: quant-elasticsearch
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ES_PASSWORD:-changeme}
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - quant-network
    restart: unless-stopped

  # ELK Stack - Logstash
  logstash:
    profiles: ["monitoring"]
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: quant-logstash
    ports:
      - "127.0.0.1:5044:5044"
      - "127.0.0.1:9600:9600"
    volumes:
      - ./monitoring/logstash/config:/usr/share/logstash/pipeline
      - ./monitoring/logstash/templates:/usr/share/logstash/templates
    depends_on:
      - elasticsearch
    environment:
      - XPACK_MONITORING_ENABLED=false
      - ELASTICSEARCH_HOST=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=changeme
    networks:
      - quant-network
    restart: unless-stopped

  # ELK Stack - Kibana
  kibana:
    profiles: ["monitoring"]
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: quant-kibana
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - quant-network
    restart: unless-stopped

networks:
  quant-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  questdb_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
