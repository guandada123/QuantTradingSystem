# QuantTradingSystem — Pre-commit Hooks
# =======================================
# 安装: pre-commit install
# 手动运行: pre-commit run --all-files
# 自动更新: pre-commit autoupdate
#
# 要求: Python >= 3.12, pre-commit >= 4.0 (已在 pyproject.toml dev 依赖中)

repos:
  # ─── Ruff: Lint + Format ──────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.5
    hooks:
      # 2026-09-29：扫描面与 CI(.github/workflows/test.yml) 对齐 —— CI 跑的是
      # `ruff check .` / `ruff format --check .`（**全仓**），而这里原本 exclude 掉 scripts/，
      # 于是 scripts/ 的格式/规则漂移只在 CI 暴露（实锤：scripts/verify_kline_consistency.py
      # 让 CI「Ruff format check」连红多日，本地门禁却一直放行）。
      # k8s/helm 仍排除（非 Python 或部署清单，CI 那边也扫不到有效内容）。
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi, jupyter]
        exclude: ^(k8s/|helm/)
      - id: ruff-format
        types_or: [python, pyi, jupyter]
        exclude: ^(k8s/|helm/)

  # ─── 基础文件清理 ──────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^(k8s/|helm/)
      - id: end-of-file-fixer
        exclude: ^(k8s/|helm/)
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^(k8s/|helm/)
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
        # 2026-11-03：pre-commit-hooks v5 起该钩子在**非 merge 状态**直接 return 0
        # （已在 v5.0.0 上实测：含 <<<<<<< 标记的文件默认 exit=0，加此参数才 exit=1）。
        # 即此前一直是恒真通过。冲突标记不只 merge 产生——手工编辑/cherry-pick/
        # rebase 都会留，所以必须硬查，不能只在 merge 时查。
        args: [--assume-in-merge]
      - id: detect-private-key
        exclude: (\.env\.example|\.env\.template|config\.example\.py)

  # ─── 发布前脱敏检查（本地脚本，仅拦推 GitHub，硬拦高危）─────────────────
  - repo: local
    hooks:
      - id: prepublish-desensitize
        name: 脱敏检查 (desensitize · pre-push)
        entry: bash $HOME/.workbuddy/skills/prepublish-desensitize/scripts/pre-push-hook.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [push]

  # 2026-11-27：助手提交归属标注（与 Claw 同款，三仓统一）。
  # 三仓 git 作者全是同一人，事后无法区分「助手写的」与「中台轮次写的」提交。
  # 只在 ASSISTANT_COMMIT=1 时追加 Assistant-Change trailer —— 无条件追加会把中台的提交
  # 也标成助手写的（错标比漏标更坏）。fail-safe：任何异常 exit 0，不阻断提交。
  - repo: local
    hooks:
      - id: assistant-trailer
        name: 助手提交归属标注（仅在 ASSISTANT_COMMIT=1 时追加）
        entry: python scripts/append_assistant_trailer.py
        language: python
        stages: [commit-msg]
        always_run: true
